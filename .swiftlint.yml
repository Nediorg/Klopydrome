# Code-size and quality thresholds for Swift.
# Code-size limits are strictly enforced. Subjective style rules that trigger
# on idiomatic conventions (e.g. short color/math variables) are disabled.

# Paths excluded from linting (build artifacts, 3rd-party upstream docs and
# the user-maintained misc/ workspace with reference materials and snippets).
excluded:
  - .build
  - dist
  - vendor
  - .swiftpm
  - misc
  - .agents

disabled_rules:
  - identifier_name
  - line_length
  - trailing_comma
  - trailing_newline
  - vertical_parameter_alignment
  - statement_position
  - large_tuple
  - non_optional_string_data_conversion
  - implicit_optional_initialization

cyclomatic_complexity:
  warning: 10
  error: 20

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

function_parameter_count:
  warning: 5
  error: 8
